<link rel="manifest" href="/manifest.webmanifest">

<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#101828;--mute:#566074;--line:#d9dfe8;--accent:#1f4ed8;--accent-ink:#fff;--ok:#17794a;--okbg:#ddf3e7;--warn:#8a5a00;--warnbg:#fcefcb;--bad:#b02a1e;--badbg:#fbe2df;--nav:#14213d;--navink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1320;--card:#171e2e;--ink:#e8ecf5;--mute:#98a3b8;--line:#2a3348;--accent:#7a9cff;--accent-ink:#0e1320;--ok:#5fd19a;--okbg:#14342a;--warn:#f0c15c;--warnbg:#3a2f12;--bad:#ff9a8f;--badbg:#3d1d1a;--nav:#1d2740}}
:root[data-theme="dark"]{--bg:#0e1320;--card:#171e2e;--ink:#e8ecf5;--mute:#98a3b8;--line:#2a3348;--accent:#7a9cff;--accent-ink:#0e1320;--ok:#5fd19a;--okbg:#14342a;--warn:#f0c15c;--warnbg:#3a2f12;--bad:#ff9a8f;--badbg:#3d1d1a;--nav:#1d2740}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Instrument Sans","Noto Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:22px 16px 64px}
.hd{display:flex;gap:12px;align-items:center;margin-bottom:20px}
.hd .t{flex:1}
.hd select{width:auto}
.logo{width:42px;height:42px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
h1{font-size:1.45rem;margin:0;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0;font-size:.95rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat span{color:var(--mute);font-size:.85rem}
.stat b{display:block;font-size:1.2rem;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.stat.bad b{color:var(--bad)}.stat.ok b{color:var(--ok)}
.today{background:var(--nav);color:var(--navink);border-radius:14px;padding:16px 18px;margin-bottom:18px}
.today h2{font-size:1.1rem;margin:0 0 4px}
.today p{margin:0;opacity:.8;font-size:.92rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{background:rgba(255,255,255,.14);color:inherit;border:1px solid rgba(255,255,255,.28)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 16px;margin-bottom:14px}
.panel summary{cursor:pointer;font-weight:600;padding:10px 0}
.panel .in{padding:4px 0 14px}
#f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
#f>label{justify-content:flex-end}
.perr{color:var(--bad);margin:6px 0 0;font-size:.88rem}.perr:empty{display:none}
button:disabled{opacity:.5;cursor:not-allowed}
label{display:flex;flex-direction:column;font-size:.85rem;color:var(--mute);gap:4px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.tabs{display:flex;gap:6px;margin:6px 0 12px;flex-wrap:wrap}.search{margin:0 0 12px}.search input{width:100%;}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{background:var(--card);border:1px solid var(--line);border-inline-start:6px solid var(--c,var(--line));border-radius:12px;padding:14px;margin-bottom:10px}
.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.client{font-weight:600}
.meta{color:var(--mute);font-size:.9rem;overflow-wrap:anywhere}
.nx{font-size:.85rem;margin-top:2px}
.r{text-align:end}
.amt{font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums}
.badge{font-size:.8rem;padding:2px 9px;border-radius:99px;font-weight:600;display:inline-block}
.b-paid{background:var(--okbg);color:var(--ok)}.b-soon{background:var(--warnbg);color:var(--warn)}.b-late{background:var(--badbg);color:var(--bad)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.msg{display:none;margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.msg.open{display:block}
.sel{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:10px}
textarea{min-height:190px;resize:vertical}
.empty{text-align:center;color:var(--mute);padding:28px 12px;border:1px dashed var(--line);border-radius:12px}
.note{color:var(--mute);font-size:.85rem;margin-top:24px}
#ov{background:#fff;color:#101828;border:1px solid var(--line);border-radius:12px;padding:28px;margin-bottom:18px}
#ov h2{font-size:1.8rem;margin:0 0 16px;letter-spacing:.02em}
#ov .g{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
#ov small{color:#566074;display:block}
#ov table{width:100%;border-collapse:collapse}
#ov td{padding:8px 0;border-top:1px solid #d9dfe8}
#ov td:last-child{text-align:end;font-variant-numeric:tabular-nums}
#ov tr.tot td{font-weight:600;font-size:1.15rem}
@media print{.wrap>*:not(#ov){display:none!important}#ov{border:0;padding:0}#ov .actions{display:none}body{background:#fff}}
@media (max-width:560px){.stats{grid-template-columns:1fr}.r{text-align:start}}

/* v1.5 visual refresh */
:root{
  --bg:#f4f6fb;--card:#ffffff;--ink:#172033;--mute:#68748a;--line:#e5e9f1;
  --accent:#4f46e5;--accent-ink:#ffffff;--ok:#12805c;--okbg:#e2f7ee;
  --warn:#946200;--warnbg:#fff4d6;--bad:#c43d4b;--badbg:#ffeaec;
  --nav:#171d38;--navink:#ffffff;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b1020;--card:#141c30;--ink:#edf1fb;--mute:#a0abc0;--line:#29344d;
    --accent:#8b85ff;--accent-ink:#10152a;--ok:#62d6a7;--okbg:#153b32;
    --warn:#f3c86a;--warnbg:#403316;--bad:#ff8793;--badbg:#421f2a;
    --nav:#20294a;--navink:#fff;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1020;--card:#141c30;--ink:#edf1fb;--mute:#a0abc0;--line:#29344d;
  --accent:#8b85ff;--accent-ink:#10152a;--ok:#62d6a7;--okbg:#153b32;
  --warn:#f3c86a;--warnbg:#403316;--bad:#ff8793;--badbg:#421f2a;
  --nav:#20294a;--navink:#fff;
}
body{
  background:
    radial-gradient(ellipse at 8% 0%,rgba(99,102,241,.10),transparent 34rem),
    radial-gradient(ellipse at 100% 12%,rgba(14,165,233,.08),transparent 28rem),
    var(--bg);
  line-height:1.55;
}
.wrap{max-width:1040px;padding:30px 22px 72px}
.hd{
  position:relative;padding:17px 19px;margin-bottom:20px;border:1px solid var(--line);
  border-radius:20px;background:var(--card);box-shadow:0 8px 28px rgba(23,32,51,.055);
}
.logo{width:48px;height:48px;border-radius:15px;box-shadow:0 7px 18px rgba(79,70,229,.22)}
h1{font-size:1.55rem;font-weight:700;letter-spacing:-.035em}
.sub{font-size:.94rem;margin-top:2px}
.hd select{max-width:145px;background:var(--bg)}
.stats{gap:14px;margin:0 0 16px}
.stat{
  position:relative;overflow:hidden;border-radius:17px;padding:17px 18px;
  box-shadow:0 7px 22px rgba(23,32,51,.045);transition:transform .18s ease,box-shadow .18s ease;
}
.stat:after{content:"";position:absolute;inset-inline-end:-24px;top:-32px;width:88px;height:88px;border-radius:50%;background:var(--accent);opacity:.055}
.stat span{font-size:.82rem;font-weight:600;letter-spacing:.015em}
.stat b{font-size:1.42rem;letter-spacing:-.025em;margin-top:5px}
.today{
  position:relative;overflow:hidden;border-radius:18px;padding:20px 22px;margin-bottom:20px;
  background:linear-gradient(115deg,#20294a,#343b70 65%,#4f46e5);
  box-shadow:0 12px 28px rgba(31,41,82,.16);
}
.today:after{content:"";position:absolute;width:190px;height:190px;border:1px solid rgba(255,255,255,.12);border-radius:50%;inset-inline-end:-55px;top:-95px;box-shadow:0 0 0 22px rgba(255,255,255,.035),0 0 0 45px rgba(255,255,255,.025)}
.today h2{font-size:1.2rem;font-weight:700;letter-spacing:-.02em}
.today p{font-size:.94rem}
.chips{position:relative;z-index:1}
.chip{border-radius:999px;padding:7px 12px;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22)}
.panel{border-radius:17px;padding:7px 18px;margin-bottom:16px;box-shadow:0 6px 20px rgba(23,32,51,.035)}
.panel summary{padding:12px 0;font-size:.98rem}
.panel .in{padding:6px 0 17px}
input,select,textarea{border-radius:11px;padding:10px 12px;transition:border-color .15s ease,box-shadow .15s ease}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
button{border-radius:11px;padding:9px 13px;font-weight:550;transition:transform .15s ease,box-shadow .15s ease,background .15s ease,border-color .15s ease}
button:hover{transform:translateY(-1px);box-shadow:0 5px 13px rgba(23,32,51,.09)}
button.primary{box-shadow:0 5px 13px color-mix(in srgb,var(--accent) 22%,transparent)}
button.primary:hover{filter:brightness(1.06)}
.tabs{gap:8px;margin:8px 0 13px}
.tabs button{padding:9px 16px;border-radius:999px;background:var(--card)}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 5px 13px color-mix(in srgb,var(--accent) 20%,transparent)}
.search{margin-bottom:14px}
.search input{padding:12px 15px;border-radius:13px;background:var(--card);box-shadow:0 4px 14px rgba(23,32,51,.025)}
.row{
  position:relative;border:1px solid var(--line);border-inline-start:4px solid var(--c,var(--line));
  border-radius:16px;padding:17px 18px;margin-bottom:12px;
  box-shadow:0 5px 18px rgba(23,32,51,.035);transition:transform .18s ease,box-shadow .18s ease;
}
.row:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(23,32,51,.075)}
.client{font-size:1.02rem;font-weight:700;letter-spacing:-.01em}
.meta{font-size:.86rem;margin-top:3px}
.amt{font-size:1.35rem;font-weight:700;letter-spacing:-.025em}
.badge{padding:4px 10px;font-size:.76rem;letter-spacing:.01em}
.actions{gap:7px}
.actions button{font-size:.88rem}
.msg{margin-top:15px;padding-top:15px}
.sel{gap:11px}
textarea{min-height:205px;line-height:1.65}
.empty{background:var(--card);border-radius:16px;padding:38px 16px}
.note{font-size:.82rem}
#ov{border-radius:16px;box-shadow:0 8px 24px rgba(23,32,51,.06)}
@media (max-width:640px){
  .wrap{padding:14px 12px 48px}
  .hd{padding:13px;border-radius:16px;gap:10px}
  .logo{width:42px;height:42px;border-radius:13px}
  h1{font-size:1.28rem}
  .hd select{max-width:112px;font-size:.85rem;padding:8px}
  .stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
  .stat{padding:12px 10px;border-radius:13px;min-width:0}
  .stat span{font-size:.72rem}
  .stat b{font-size:1rem;overflow-wrap:anywhere}
  .today{padding:17px;border-radius:16px}
  .row{padding:14px;border-radius:14px}
  .top{gap:8px}
  .amt{font-size:1.12rem}
}
@media (max-width:390px){
  .stats{grid-template-columns:1fr}
  .hd{flex-wrap:wrap}
  .hd .t{min-width:calc(100% - 64px)}
  .hd select{margin-inline-start:auto}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}
